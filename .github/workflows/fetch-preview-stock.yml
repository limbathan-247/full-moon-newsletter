name: Fetch preview stock
on:
  push:
    branches: [preview-assets]
    paths:
      - '.github/workflows/fetch-preview-stock.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-assets
      - name: Download real stock photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-stock
          curl -L --fail --retry 3 'https://images.pexels.com/photos/7752683/pexels-photo-7752683.jpeg?cs=srgb&dl=pexels-arina-krasnikova-7752683.jpg&fm=jpg' -o preview-stock/hand-chest.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8279473/pexels-photo-8279473.jpeg?cs=srgb&dl=pexels-rdne-8279473.jpg&fm=jpg' -o preview-stock/journaling.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8354517/pexels-photo-8354517.jpeg?auto=compress&cs=tinysrgb&w=1600' -o preview-stock/light-shadow.jpg
          file preview-stock/*
      - name: Upload preview stock artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-stock
          path: preview-stock/*.jpg
          retention-days: 1
